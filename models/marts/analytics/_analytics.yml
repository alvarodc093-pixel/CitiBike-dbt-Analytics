version: 2

models:
  - name: mart_daily_demand
    description: Un día por fila con los viajes por tipo de usuario y de bici, la meteorología y el tipo de día.
    columns:
      - name: date_day
        data_tests: [unique, not_null, is_complete_date_spine]
      - name: trips
        data_tests:
          - accepted_range:
              arguments: {min_value: 0}
      - name: share_electric
        data_tests:
          - accepted_range:
              arguments: {min_value: 0, max_value: 1}

  - name: mart_station_daily_balance
    description: >
      Una fila por estación propia (JC/HB) y día con salidas, llegadas y flujo neto
      (llegadas - salidas). Negativo = la estación pierde bicis ese día.
    data_tests:
      - unique_combination:
          arguments:
            columns: ['station_id', 'trip_date']
    columns:
      - name: station_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_stations')
                field: station_id

  - name: mart_station_rebalancing
    description: >
      Una fila por estación propia con su desequilibrio medio y el porcentaje de días en
      que pierde o gana 10 o más bicis (umbral configurable con la variable umbral_desequilibrio).
    columns:
      - name: station_id
        data_tests: [unique, not_null]
      - name: daily_balance_profile
        description: Desequilibrio en el conjunto del día (media de 3 o más bicis perdidas o ganadas).
        data_tests:
          - accepted_values:
              arguments:
                values: ['se vacía', 'se llena', 'equilibrada']
      - name: am_peak_net_flow
        description: Bicis ganadas (+) o perdidas (-) de media entre las 6:00 y las 9:59 de un laborable.
      - name: peak_profile
        data_tests:
          - accepted_values:
              arguments:
                values: ['se llena por la mañana', 'se vacía por la mañana', 'estable en punta']
      - name: share_days_draining
        data_tests:
          - accepted_range:
              arguments: {min_value: 0, max_value: 1}

  - name: mart_weather_impact
    description: >
      Efecto de la meteorología en la demanda. Cada día se compara con la media de los
      días secos del mismo mes y tipo de día, para no confundir "llueve" con "es invierno".
    columns:
      - name: weather_category
        data_tests: [unique, not_null]
      - name: avg_pct_vs_dry
        description: Variación media frente a un día seco comparable (-0,30 = 30 % menos viajes).

  - name: mart_station_hourly_profile
    description: >
      Una fila por estación propia, tipo de día (laborable / fin de semana o festivo) y
      hora, con las salidas y llegadas medias. Las medias se calculan sobre los días en
      que la estación existía.
    data_tests:
      - unique_combination:
          arguments:
            columns: ['station_id', 'day_group', 'hour']
    columns:
      - name: hour
        data_tests:
          - accepted_range:
              arguments: {min_value: 0, max_value: 23}

  - name: mart_od_flows
    description: Una fila por par origen-destino con el número de viajes y su ranking.
    data_tests:
      - unique_combination:
          arguments:
            columns: ['start_station_id', 'end_station_id']
    columns:
      - name: trips
        data_tests:
          - accepted_range:
              arguments: {min_value: 1}

  - name: mart_data_quality
    description: >
      Una fila por fichero mensual: filas recibidas, duplicados eliminados y viajes
      excluidos por cada motivo. raw_rows = duplicados + válidos + todas las exclusiones.
    columns:
      - name: source_file_month
        data_tests: [unique, not_null]
      - name: share_valid
        description: Si baja del 95 % el test lo marca como aviso, para revisar ese fichero.
        data_tests:
          - accepted_range:
              arguments: {min_value: 0.95, max_value: 1}
              config:
                severity: warn
